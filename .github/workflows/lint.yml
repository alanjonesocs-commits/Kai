name: Lint Checks

on:
  push:
    branches:
      - main
      - test/lint-workflow
      - build/nia15-full-duplex-wakeword
      - nia15/futuristic-interface
  pull_request:
    branches:
      - main
      - frankenstai/three-hour-engineering
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, test and build NIA15
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Verify Kotlin formatting
        run: gradle spotlessCheck --no-daemon --stacktrace

      - name: Run common desktop test suite
        run: gradle :composeApp:desktopTest --no-daemon --stacktrace

      - name: Compile Android FOSS debug APK
        run: gradle :androidApp:assembleFossDebug -x updateScreenshots --no-daemon --stacktrace

      - name: Upload Pixel installation APK
        uses: actions/upload-artifact@v4
        with:
          name: nia15-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
