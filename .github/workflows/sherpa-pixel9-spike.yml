name: Sherpa Pixel 9 Spike Build

on:
  push:
    branches:
      - experiment/sherpa-onnx-pixel9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-spike:
    name: Desktop tests and isolated Android spike APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Verify toolchain
        run: |
          java -version
          sdkmanager --list_installed

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run common desktop tests and build isolated FOSS debug APK
        run: |
          ./gradlew :composeApp:desktopTest :androidApp:assembleFossDebug --no-daemon --stacktrace

      - name: Upload Sherpa spike APK
        uses: actions/upload-artifact@v4
        with:
          name: nia-sherpa-pixel9-spike
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
