name: Nia Live Voice Verification

on:
  push:
    branches:
      - build/nia15-full-duplex-wakeword
      - nia15/futuristic-interface
  pull_request:
    branches:
      - frankenstai/three-hour-engineering
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nia-live-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-build:
    name: Desktop tests and Android build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out voice branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Run common desktop test suite
        run: |
          for attempt in 1 2 3; do
            gradle :composeApp:desktopTest --no-daemon --stacktrace && exit 0
            echo "Desktop tests failed on attempt $attempt; retrying after transient dependency/network failure..."
            sleep 15
          done
          exit 1

      - name: Compile Android FOSS debug APK
        run: |
          for attempt in 1 2 3; do
            gradle :androidApp:assembleFossDebug -x updateScreenshots --no-daemon --stacktrace && exit 0
            echo "Android build failed on attempt $attempt; retrying after transient dependency/network failure..."
            sleep 15
          done
          exit 1

      - name: Upload Pixel installation APK
        uses: actions/upload-artifact@v4
        with:
          name: nia15-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
