name: NIA15 Memory Integrity Tests

on:
  pull_request:
    paths:
      - "composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/nia/memory/**"
      - "composeApp/src/commonTest/kotlin/com/inspiredandroid/kai/nia/memory/**"
      - ".github/workflows/nia15-memory-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-integrity:
    name: Memory bridge and persistence tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop unit tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace
