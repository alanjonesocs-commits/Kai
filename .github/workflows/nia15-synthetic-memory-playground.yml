name: NIA15 Synthetic Memory Lab APK

on:
  push:
    branches:
      - experiment/nia15-synthetic-memory-playground
    paths:
      - "composeApp/**"
      - "androidApp/**"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/nia15-synthetic-memory-playground.yml"
  pull_request:
    paths:
      - "composeApp/**"
      - "androidApp/**"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/nia15-synthetic-memory-playground.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nia15-synthetic-memory-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build synthetic memory lab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run desktop test suite
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

      - name: Compile Android FOSS debug APK
        run: ./gradlew :androidApp:assembleFossDebug -x updateScreenshots --no-daemon --stacktrace

      - name: Upload synthetic memory lab APK
        uses: actions/upload-artifact@v4
        with:
          name: nia15-synthetic-memory-lab-foss-debug-apk
          path: androidApp/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
